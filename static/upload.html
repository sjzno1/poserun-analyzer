<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频上传 - PoseRun 跑姿分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/common.css" rel="stylesheet">
</head>
<body>
    <script>window.PAGE = 'upload';</script>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-8 py-4">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-upload me-2"></i>上传视频文件</h5>
                    </div>
                    <div class="card-body">
                        <div class="upload-area" id="dropZone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h5>拖放视频文件到此处</h5>
                            <p class="text-muted">支持 MP4, AVI, MOV 格式 (最大 100MB)</p>
                            <input type="file" id="videoFile" accept="video/*" hidden>
                            <button class="btn btn-primary" onclick="document.getElementById('videoFile').click()">
                                选择视频文件
                            </button>
                        </div>

                        <!-- 学员信息 + 报告格式 -->
                        <div class="row mt-3 g-3 align-items-end">
                            <div class="col-md-5">
                                <label for="userNameInput" class="form-label mb-1">
                                    <i class="fas fa-user me-1"></i>学员姓名
                                </label>
                                <input type="text" class="form-control" id="userNameInput"
                                       placeholder="默认使用当前登录账号姓名" maxlength="20">
                            </div>
                            <div class="col-md-3">
                                <label for="reportFormatSelect" class="form-label mb-1">
                                    <i class="fas fa-file me-1"></i>报告格式
                                </label>
                                <select class="form-select" id="reportFormatSelect">
                                    <option value="pdf" selected>PDF</option>
                                    <option value="docx">Word (docx)</option>
                                </select>
                            </div>
                        </div>

                        <div id="videoPreview" class="video-container mt-4" style="display: none;">
                            <video id="videoElement" controls style="width: 100%; max-height: 400px;"></video>
                        </div>

                        <div class="loading-spinner mt-3" id="loadingSpinner">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2">正在分析视频，完成后将自动跳转到结果页...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/js/font-awesome.min.js"></script>
    <script src="/common.js"></script>
    <script>
        let currentFileName = null;

        const dropZone = document.getElementById('dropZone');
        const videoFileInput = document.getElementById('videoFile');
        const videoPreview = document.getElementById('videoPreview');
        const videoElement = document.getElementById('videoElement');
        const loadingSpinner = document.getElementById('loadingSpinner');

        function onAuthReady(user) {
            const nameInput = document.getElementById('userNameInput');
            if (nameInput && !nameInput.value && user && user.name) {
                nameInput.value = user.name;
            }
        }

        // 文件拖放 / 选择
        dropZone.addEventListener('dragover', function (e) {
            e.preventDefault();
            dropZone.style.backgroundColor = 'rgba(52, 152, 219, 0.2)';
        });
        dropZone.addEventListener('drop', function (e) {
            e.preventDefault();
            dropZone.style.backgroundColor = 'rgba(52, 152, 219, 0.05)';
            const files = e.dataTransfer.files;
            if (files.length > 0) uploadFile(files[0]);
        });
        dropZone.addEventListener('click', function () { videoFileInput.click(); });
        videoFileInput.addEventListener('change', function (e) {
            const files = e.target.files;
            if (files.length > 0) uploadFile(files[0]);
        });

        async function uploadFile(file) {
            const allowedTypes = ['video/mp4', 'video/avi', 'video/quicktime', 'video/x-msvideo', 'video/webm'];
            if (!allowedTypes.includes(file.type)) {
                alert('不支持的视频格式! 请选择 MP4, AVI, MOV 格式的视频文件.');
                return;
            }

            const fileURL = URL.createObjectURL(file);
            videoElement.src = fileURL;
            videoPreview.style.display = 'block';

            const formData = new FormData();
            formData.append('video', file);

            try {
                loadingSpinner.style.display = 'block';

                const uploadResponse = await apiFetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const uploadData = await uploadResponse.json();

                if (!uploadData.success) {
                    alert('上传失败: ' + uploadData.error);
                    loadingSpinner.style.display = 'none';
                    return;
                }

                currentFileName = uploadData.filename;

                const userNameInput = document.getElementById('userNameInput');
                const reportFormatSelect = document.getElementById('reportFormatSelect');
                const userName = (userNameInput && userNameInput.value.trim())
                    || (authUser && (authUser.name || authUser.username))
                    || file.name.split('.')[0];
                const reportFormat = (reportFormatSelect && reportFormatSelect.value) || 'pdf';

                await analyzePose(currentFileName, userName, '系统自动评估', reportFormat);

            } catch (error) {
                if (error.message !== 'unauthorized') {
                    console.error('上传失败:', error);
                    alert('上传失败，请检查网络连接.');
                }
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        async function analyzePose(videoFileName, userName, coachName, reportFormat) {
            try {
                const response = await apiFetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_file: videoFileName,
                        user_name: userName,
                        coach_name: coachName,
                        keyframes: 5,
                        report_format: reportFormat || 'pdf'
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    // 结果缓存到 localStorage，供"分析结果"页展示
                    localStorage.setItem('poserun_last_result', JSON.stringify(data));
                    // 跳转结果页
                    location.href = '/results.html';
                } else {
                    alert('分析失败: ' + data.error);
                }
            } catch (error) {
                if (error.message !== 'unauthorized') {
                    console.error('分析失败:', error);
                    alert('分析失败，请检查网络连接.');
                }
            }
        }
    </script>
</body>
</html>
